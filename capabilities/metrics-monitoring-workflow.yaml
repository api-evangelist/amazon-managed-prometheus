naftiko: 1.0.0-alpha2
info:
  label: Amazon Managed Service for Prometheus - Metrics Monitoring Workflow
  description: Workflow capability for DevOps and SRE teams to manage Prometheus workspaces, configure alerting, and define
    recording rules for container metrics monitoring.
  tags:
  - Amazon
  - Prometheus
  - Monitoring
  - Observability
  - Containers
  - Alerting
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: managed-prometheus
    baseUri: https://aps.amazonaws.com
    description: Amazon Managed Service for Prometheus REST API
    authentication:
      type: apikey
      key: Authorization
      value: AWS4-HMAC-SHA256 {{AWS_ACCESS_KEY_ID}}
      placement: header
    resources:
    - name: workspaces
      path: /workspaces
      description: Manage Prometheus workspaces
      operations:
      - name: create-workspace
        method: POST
        description: Create a Prometheus workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-workspaces
        method: GET
        description: List Prometheus workspaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describe-workspace
        method: GET
        description: Get workspace details
        inputParameters:
        - name: workspaceId
          in: path
          type: string
          required: true
          description: Workspace ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: alert-manager
      path: /workspaces/{workspaceId}/alertmanager/definition
      description: Manage alert manager definitions
      operations:
      - name: create-alert-manager-definition
        method: POST
        description: Create alert manager definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describe-alert-manager-definition
        method: GET
        description: Get alert manager definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: rule-groups
      path: /workspaces/{workspaceId}/rulegroupsnamespaces
      description: Manage rule group namespaces
      operations:
      - name: create-rule-groups-namespace
        method: POST
        description: Create a rule groups namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-rule-groups-namespaces
        method: GET
        description: List rule group namespaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: prometheus-monitoring-api
    description: Unified REST API for Prometheus metrics monitoring workflows.
    resources:
    - path: /v1/workspaces
      name: workspaces
      description: Prometheus workspaces
      operations:
      - method: GET
        name: list-workspaces
        description: List workspaces
        call: managed-prometheus.list-workspaces
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-workspace
        description: Create a workspace
        call: managed-prometheus.create-workspace
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workspaces/{id}/alert-manager
      name: alert-manager
      description: Alert manager configuration
      operations:
      - method: POST
        name: create-alert-manager
        description: Create alert manager
        call: managed-prometheus.create-alert-manager-definition
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: prometheus-monitoring-mcp
    transport: http
    description: MCP server for AI-assisted Prometheus metrics monitoring.
    tools:
    - name: list-prometheus-workspaces
      description: List all Prometheus workspaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: managed-prometheus.list-workspaces
      outputParameters:
      - type: object
        mapping: $.
    - name: create-prometheus-workspace
      description: Create a new Prometheus workspace for storing container metrics
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: managed-prometheus.create-workspace
      outputParameters:
      - type: object
        mapping: $.
    - name: describe-prometheus-workspace
      description: Get workspace details and Prometheus remote write endpoint URL
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: managed-prometheus.describe-workspace
      with:
        workspaceId: tools.workspaceId
      outputParameters:
      - type: object
        mapping: $.
    - name: configure-alert-manager
      description: Configure alert manager for Prometheus alerting notifications
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: managed-prometheus.create-alert-manager-definition
      outputParameters:
      - type: object
        mapping: $.
    - name: create-recording-rules
      description: Create Prometheus recording and alerting rules namespace
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: managed-prometheus.create-rule-groups-namespace
      outputParameters:
      - type: object
        mapping: $.
    - name: list-rule-groups
      description: List all Prometheus rule group namespaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: managed-prometheus.list-rule-groups-namespaces
      outputParameters:
      - type: object
        mapping: $.
